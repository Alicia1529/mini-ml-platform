[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ml-platform"
version = "0.1.0"
description = "Learn Ray Tasks through a local batch moderation workload"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "ray[data]==2.59.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
dashboard = ["ray[default]==2.59.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts real local Ray worker processes"]
